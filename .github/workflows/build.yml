name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build & publish (win-x64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Strict build (warnings as errors)
        run: dotnet build GameOptimizer.csproj -c Release -warnaserror

      - name: Publish single-file
        run: >
          dotnet publish GameOptimizer.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GAMEOPTIMIZ-win-x64
          path: bin/Release/net8.0-windows/win-x64/publish/
